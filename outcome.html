<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Outcome</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styleOutcome.css">
</head>

<body>
  <header class="header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3Z"/>
        <path d="M5 13.2v3.6c0 1.5 3.1 3.2 7 3.2s7-1.7 7-3.2v-3.6l-7 3.8-7-3.8Z"/>
      </svg>
      <div class="brand-text">
        <span class="brand-title">CampusConnect</span>
        <span class="brand-sub">VUT Student Portal</span>
      </div>
    </div>

    <button class="user" type="button" aria-label="User menu">
      <svg class="user-avatar" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="14" cy="14" r="12.5"/>
        <circle cx="14" cy="11" r="4"/>
        <path d="M6.5 22.5c1.4-3.6 4.2-5.3 7.5-5.3s6.1 1.7 7.5 5.3" stroke-linecap="round"/>
      </svg>
      <span class="user-info">
        <span>Student</span>
        <span>2226018711</span>
      </span>
      <svg class="user-chevron" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true">
        <path d="M1 3l4 4 4-4z"/>
      </svg>
    </button>
  </header>

  <main class="outcome-page">
    <h1 class="outcome-title">Outcome</h1>

    <div class="outcome-container">
      <div class="outcome-card">
        <div class="outcome-row">
          <span class="outcome-label">Document</span>
          <span class="outcome-value">AR - R50</span>
        </div>
        <div class="outcome-row">
          <span class="outcome-label">Delivery email</span>
          <span class="outcome-value">student.test@...</span>
        </div>
      </div>

      <p class="outcome-note">Complete within 60 seconds</p>

      <div class="outcome-actions">
        <a id="status-link" class="outcome-btn cont" href="#">continue</a>
      </div>
    </div>
  </main>

  <script>
  document.addEventListener('DOMContentLoaded', function () {
    const LIMIT_SECONDS = 35;
    const statusLink = document.getElementById('status-link');
    const params = new URLSearchParams(window.location.search);
    const startTime = params.get('t') || localStorage.getItem('processStartTime');

    console.log('[outcome.html] Loaded. startTime =', startTime);

    const monitor = setInterval(() => {
      if (!startTime) {
        console.warn('[outcome.html] No startTime found.');
        clearInterval(monitor);
        return;
      }

      const elapsedSeconds = ((Date.now() - Number(startTime)) / 1000).toFixed(1);
      if (elapsedSeconds < LIMIT_SECONDS) {
        console.log(`[outcome.html] Elapsed: ${elapsedSeconds}s (Under 35s -> will PASS)`);
      } else {
        console.warn(`[outcome.html] Elapsed: ${elapsedSeconds}s (Over 35s -> will ERROR)`);
      }
    }, 1000);

    statusLink.addEventListener('click', function (event) {
      event.preventDefault();
      clearInterval(monitor);

      if (!startTime) {
        window.location.href = 'statusError.html';
        return;
      }

      const elapsedSeconds = (Date.now() - Number(startTime)) / 1000;
      console.log(`[outcome.html] Continue clicked at ${elapsedSeconds.toFixed(2)}s.`);
      localStorage.removeItem('processStartTime');

      if (elapsedSeconds < LIMIT_SECONDS) {
        window.location.href = 'statusPass.html';
      } else {
        window.location.href = 'statusError.html';
      }
    });
  });
</script>
</body>
</html>
