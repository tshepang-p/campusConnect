<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CampusConnect – VUT Student Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styleDash.css">
</head>

  <header class="header">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M12 3 1 9l11 6 9-4.9V17h2V9L12 3Z"/>
        <path d="M5 13.2v3.6c0 1.5 3.1 3.2 7 3.2s7-1.7 7-3.2v-3.6l-7 3.8-7-3.8Z"/>
      </svg>
      <div class="brand-text">
        <span class="brand-title">CampusConnect</span>
        <span class="brand-sub">VUT Student Portal</span>
      </div>
    </div>

    <button class="user" type="button" aria-label="User menu">
      <svg class="user-avatar" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <circle cx="14" cy="14" r="12.5"/>
        <circle cx="14" cy="11" r="4"/>
        <path d="M6.5 22.5c1.4-3.6 4.2-5.3 7.5-5.3s6.1 1.7 7.5 5.3" stroke-linecap="round"/>
      </svg>
      <span class="user-info">
        <span>Student</span>
        <span>2226018711</span>
      </span>
      <svg class="user-chevron" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true">
        <path d="M1 3l4 4 4-4z"/>
      </svg>
    </button>
  </header>

  <body>


  <main class="dashboard">
    <h1 class="dashboard-title">Dashboard</h1>
    <p class="dashboard-sub">Welcome to CampusConnect. Select an option below to continue.</p>

    <div class="card-grid">
      <a class="card" href="#">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        <span class="card-label">Academic</span>
      </a>
      <a class="card" href="#">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" x2="21" y1="22" y2="22"/><line x1="6" x2="6" y1="18" y2="11"/><line x1="10" x2="10" y1="18" y2="11"/><line x1="14" x2="14" y1="18" y2="11"/><line x1="18" x2="18" y1="18" y2="11"/><polygon points="12 2 20 7 4 7"/>
        </svg>
        <span class="card-label">Admin</span>
      </a>
      <a class="card" href="#">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>
        </svg>
        <span class="card-label">Utilities</span>
      </a>
      <a class="card" href="#">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/>
        </svg>
        <span class="card-label">Finance</span>
      </a>
      <a class="card" href="other.html">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
        </svg>
        <span class="card-label">Other</span>
      </a>
      <a class="card" href="#">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/>
        </svg>
        <span class="card-label">Help</span>
      </a>
      <a class="card" href="#">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="card-label">Profile</span>
      </a>
      <a class="card" href="#">
        <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>
        </svg>
        <span class="card-label">Logout</span>
      </a>
    </div>
  </main>
</body>

</html>
